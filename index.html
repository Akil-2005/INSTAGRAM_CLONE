<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone-container">
        

        <div id="homePage" class="page active">
            <div class="header">
                <div>
                    
                    <h1 class="insta-logo">Instagram</h1>
                    <div class="header-actions">
                        <img src="moree.png" class="header-icon" alt="Upload">
                        <img src="heart.png" class="header-icon" alt="Notifications">
                    </div>
                </div>
            </div>

            <div class="stories-section">
                <div class="stories">
                    <div class="story">
                        <div class="story-pic has-story">
                            <img src="7fcf8ed2-b552-45db-b5a7-2cce4ccdba39.jpg" alt="Virat Kohli" class="story-avatar">
                        </div>
                        <div class="story-name"><p>Your story</p></div>
                    </div>
                    <div class="story">
                        <div class="story-pic has-story">
                            <img src="941aaa55-2113-4770-9723-f524608c39d5.jpg" alt="Virat Kohli" class="story-avatar">
                        </div>
                        <div class="story-name"><p>iam._.peter</p></div>
                    </div>
                    <div class="story">
                        <div class="story-pic has-story">
                            <img src="b296944f-5e3f-4d79-9b2f-65186f48e4ed.jpg" alt="Chris" class="story-avatar">
                        </div>
                        <div class="story-name"><p>gojo._.</p></div>
                    </div>
                </div>
            </div>

            <div class="feed">
                <div class="post">
                    <div class="post-header">
                        <div class="post-user">
                            <div class="post-user-avatar">
                                <img src="download (4).jpg" alt="User" class="user-img">
                            </div>
                            <div>
                                <div class="post-username"><p>i_sxrxthi</p></div>
                                <div class="post-location">EMINEM• Superman (Instrumental) </div>
                            </div>
                        </div>
                     
                    </div>
                    <img src="download (3).jpg" class="post-image" alt="Post image"/>
                    <div class="post-actions">
                        <div class="post-actions-left">
                            <img src="heart.png" class="action-icon" alt="Like">
                            <img src="bubble-chat.png" class="action-icon" alt="Comment">
                        </div>
                        <img src="save-instagram.png" class="action-icon" alt="Save">
                    </div>
                    <div class="post-content">
                        <div class="post-likes">Liked by akil8x and 4,885,919 others</div>
                        <div class="post-description">
                            <span class="username">i_sxrxthi</span>
                            <span class="caption"><p>Follow for More......!</p></span>
                        </div>
                        <div class="post-time">2 HOURS AGO</div>
                    </div>
                </div>
            </div>

       

        <div class="bottom-nav">
          <img src="home.png" class="nav-icon active" width="24" height="24" >
          <img src="search.png" class="nav-icon" width="24" height="24">
          <img src="moree.png" class="nav-icon" width="24" height="24">
          <img src="clapper.png" class="nav-icon" width="24" height="24">
        <a href="profile.html"><img src="7fcf8ed2-b552-45db-b5a7-2cce4ccdba39.jpg" class="nav-icon" onclick="showPage('profile')" style="width: 24px; height: 24px; border-radius: 50%; border: 1px solid white;"></a>
    </div>


</body>
</html>
